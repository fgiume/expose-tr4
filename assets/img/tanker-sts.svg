<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Two vessels transferring cargo at night with the AIS signal switched off">
  <title>Ship-to-ship transfer at night</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050d1f"/><stop offset="1" stop-color="#16315e"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a52"/><stop offset="1" stop-color="#071428"/>
    </linearGradient>
    <style>
      .wave{animation:bob 4s ease-in-out infinite alternate}
      .wave2{animation:bob 5s ease-in-out infinite alternate-reverse}
      @keyframes bob{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
      .blink{animation:blink 1.6s steps(2,start) infinite}
      @keyframes blink{to{opacity:.15}}
      text{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:12px;fill:#dbe8fb;letter-spacing:.06em}
    </style>
  </defs>
  <rect width="640" height="400" fill="url(#sky)"/>
  <g fill="#fff">
    <circle cx="60" cy="50" r="1.5"/><circle cx="140" cy="90" r="1.2"/><circle cx="230" cy="40" r="1.6"/>
    <circle cx="330" cy="70" r="1.2"/><circle cx="410" cy="30" r="1.5"/><circle cx="520" cy="80" r="1.3"/>
    <circle cx="590" cy="45" r="1.6"/><circle cx="480" cy="140" r="1"/><circle cx="90" cy="150" r="1"/>
  </g>
  <circle cx="545" cy="70" r="28" fill="#f6efd2" opacity=".95"/><circle cx="556" cy="62" r="26" fill="#050d1f" opacity=".35"/>
  <rect y="220" width="640" height="180" fill="url(#sea)"/>
  <rect y="218" width="640" height="3" fill="#2d5a99" opacity=".6"/>

  <!-- large tanker -->
  <g transform="translate(40 150)">
    <path d="M0 62H300L280 94H26Z" fill="#1b2a44"/>
    <path d="M0 62H300L298 70H2Z" fill="#c1121f"/>
    <rect x="210" y="22" width="56" height="40" fill="#e8eef9"/>
    <rect x="224" y="2" width="26" height="22" fill="#e8eef9"/>
    <rect x="232" y="-14" width="10" height="18" fill="#ffb020"/>
    <g stroke="#6b7a99" stroke-width="3" fill="none"><path d="M30 62V44H190V62M60 44V62M100 44V62M140 44V62M180 44V62"/></g>
    <g fill="#ffd36b"><rect x="216" y="30" width="6" height="6"/><rect x="228" y="30" width="6" height="6"/><rect x="240" y="30" width="6" height="6"/><rect x="252" y="30" width="6" height="6"/></g>
  </g>

  <!-- smaller vessel -->
  <g transform="translate(400 190)">
    <path d="M0 40H170L158 64H18Z" fill="#26364f"/>
    <path d="M0 40H170L169 46H1Z" fill="#2ec4b6"/>
    <rect x="10" y="12" width="44" height="28" fill="#dfe8f6"/>
    <rect x="22" y="-2" width="20" height="16" fill="#dfe8f6"/>
    <g stroke="#6b7a99" stroke-width="3" fill="none"><path d="M80 40V24H150V40M100 24V40M125 24V40"/></g>
  </g>

  <!-- transfer hose -->
  <path d="M338 236 C 360 270, 390 270, 410 236" fill="none" stroke="#ffb020" stroke-width="5" stroke-linecap="round"/>

  <!-- waves -->
  <g fill="none" stroke="#5fb4f0" stroke-width="3" stroke-linecap="round" opacity=".7">
    <path class="wave" d="M0 292q20-10 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0"/>
    <path class="wave2" d="M-20 330q20-10 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0"/>
    <path class="wave" d="M0 368q20-10 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0"/>
  </g>

  <!-- AIS off -->
  <g transform="translate(140 108)" fill="none" stroke="#ffb020" stroke-width="3" stroke-linecap="round">
    <path d="M-16-14a22 22 0 0 1 32 0" stroke-dasharray="3 6" opacity=".6"/>
    <path d="M-8-4a11 11 0 0 1 16 0" stroke-dasharray="3 5" opacity=".9"/>
    <path d="M-12-26L12 -2M12-26L-12-2" stroke="#ff5a4d" class="blink"/>
  </g>
  <text x="104" y="86">AIS SWITCHED OFF</text>

  <!-- spoofed position -->
  <g transform="translate(540 130)">
    <path d="M0 0C-14-16-14-34 0-34S14-16 0 0Z" fill="#ffb020"/><circle cx="0" cy="-22" r="4" fill="#0a1a33"/>
  </g>
  <path d="M500 232 C 515 190, 530 160, 538 132" fill="none" stroke="#ffb020" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="430" y="108">FALSE POSITION BROADCAST</text>
</svg>
