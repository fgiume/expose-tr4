<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Stolen funds hopping through many wallets before being cashed out">
  <title>Laundering stolen crypto funds</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14122e"/><stop offset="1" stop-color="#2a1f5c"/></linearGradient>
    <style>
      .hop{stroke-dasharray:5 7;animation:dash 2s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-48}}
      text{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:12px;fill:#e5defc;letter-spacing:.06em}
    </style>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <g stroke="#8a5cf6" stroke-opacity=".12">
    <path d="M0 80H640M0 160H640M0 240H640M0 320H640M80 0V400M160 0V400M240 0V400M320 0V400M400 0V400M480 0V400M560 0V400"/>
  </g>
  <!-- links -->
  <g fill="none" stroke="#b79cff" stroke-width="2" class="hop">
    <path d="M110 200L230 110M110 200L230 200M110 200L230 290"/>
    <path d="M230 110L360 70M230 110L360 160M230 200L360 160M230 200L360 250M230 290L360 250M230 290L360 340"/>
    <path d="M360 70L500 200M360 160L500 200M360 250L500 200M360 340L500 200"/>
  </g>
  <!-- nodes -->
  <g fill="#1c1642" stroke="#8a5cf6" stroke-width="3">
    <rect x="60" y="168" width="100" height="64" rx="12" fill="#3a1f7a"/>
    <rect x="195" y="85" width="70" height="50" rx="10"/><rect x="195" y="175" width="70" height="50" rx="10"/><rect x="195" y="265" width="70" height="50" rx="10"/>
    <rect x="330" y="48" width="60" height="44" rx="10"/><rect x="330" y="138" width="60" height="44" rx="10"/><rect x="330" y="228" width="60" height="44" rx="10"/><rect x="330" y="318" width="60" height="44" rx="10"/>
    <rect x="450" y="168" width="140" height="64" rx="12" stroke="#ffb020" fill="#3a2a0a"/>
  </g>
  <g fill="#b79cff"><circle cx="230" cy="110" r="5"/><circle cx="230" cy="200" r="5"/><circle cx="230" cy="290" r="5"/>
    <circle cx="360" cy="70" r="4"/><circle cx="360" cy="160" r="4"/><circle cx="360" cy="250" r="4"/><circle cx="360" cy="340" r="4"/></g>
  <text x="76" y="196">EXCHANGE</text><text x="76" y="214">HACKED</text>
  <text x="196" y="76">HOP 1</text>
  <text x="332" y="40">HOP 2</text>
  <text x="474" y="196" fill="#ffd36b" style="fill:#ffd36b">CASH-OUT</text>
  <text x="474" y="214" style="fill:#ffd36b">OVER-THE-COUNTER</text>
</svg>
